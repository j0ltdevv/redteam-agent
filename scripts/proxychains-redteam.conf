# proxychains-redteam.conf — conf dédiée redteam (T16 OPSEC).
# Ne pas modifier /etc/proxychains.conf (conf système : socks4 sur un port qui
# n'écoutait pas, localnet tous commented out). Celle-ci vise le SOCKS5 publié
# par redteam-tor-gateway en loopback (127.0.0.1:9050, cf. docker-compose.yml).
#
# Usage : proxychains4 -q -f /home/j0wlt/redteam-agent/scripts/proxychains-redteam.conf <cmd>
#
# Caveat proxy_dns : les localnet ne s'appliquent qu'aux IP littérales — viser
# les cibles lab par IP (hostname interne → résolution via Tor exit → échec,
# fail-closed). remote_dns_subnet 224 = plage fake pour la résolution distante.

strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

# Lab / local = direct (Tor ne route pas RFC1918 ; les docker bridges et le
# loopback doivent rester joignables en clair — cibles locales non émettrices
# vers l'extérieur, pas une fuite OPSEC).
localnet 127.0.0.0/255.0.0.0
localnet 10.0.0.0/255.0.0.0
localnet 172.16.0.0/255.240.0.0
localnet 192.168.0.0/255.255.0.0

[ProxyList]
socks5 127.0.0.1 9050
