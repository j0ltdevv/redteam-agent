# ProxyChains — anonymat (plan 2 niveaux)
# Usage UNIQUEMENT pour les outils sans support proxy natif : px <commande>
# (ou proxychains4 -f ~/redteam-agent/.opencode/references/proxychains-anonymat.conf <commande>)
# Jamais en wrapper global : perte 30-50% de débit.

# dynamic_chain (et NON strict_chain) : saute les proxys morts de la chaîne
dynamic_chain

# DNS proxifié : les requêtes DNS passent par le proxy (pas de fuite locale)
proxy_dns

# timeout court comme demandé par le plan
tcp_connect_time_out 5000

[ProxyList]
# RENSEIGNE TON PROXY ICI (SOCKS5 fourni par ton provider — Proton n'en expose pas en CLI).
# Interdits du plan : ne PAS chaîner VPN+Tor sauf anonymat niveau APT (inutile pour le lab CTF).
# Exemple :
# socks5 127.0.0.1 1080
