# nftables OPSEC — cage opencode (P4, application MANUELLE)
# Cible : /etc/nftables.d/opencode-opsec.conf
# Appliquer (humain, sudo requis, une fois) :
#   sudo cp .opencode/references/nftables-opsec.conf /etc/nftables.d/opencode-opsec.conf
#   sudo nft -f /etc/nftables.d/opencode-opsec.conf
# Verifier :
#   sudo nft list ruleset | grep opencode
# NOTE : remplacer <tor-bridge-ip> et <opencode-gid> avant application (voir commentaires).

table inet opencode {
    chain output {
        type filter hook output priority 0
        policy accept

        # Loopback — toujours autorise
        ip daddr 127.0.0.0/8 accept

        # Lab local — autorise (pentest lab isole)
        ip daddr 192.168.56.0/24 accept
        ip daddr 10.0.0.0/8 accept

        # DNS autorise — uniquement resolvers approuves, udp/53
        udp dport 53 ip daddr 1.1.1.1 accept
        udp dport 53 ip daddr 9.9.9.9 accept

        # Tor bridge — remplacer <tor-bridge-ip> par l IP reelle du bridge
        # Obtenir l IP via : docker network inspect redteam-tor-net
        ip daddr <tor-bridge-ip> accept

        # Blocage final — tout le reste du trafic de l user opencode est drop
        # Remplacer <opencode-gid> par le gid reel de l user opencode via : id -g
        meta skgid <opencode-gid> drop
    }
}
