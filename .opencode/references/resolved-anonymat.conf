# Drop-in systemd-resolved — anonymat (plan 2 niveaux)
# Geste humain (sudo) : voir README-anonymat.md
# DoT déjà actif aujourd'hui (Quad9 auth TLS) ; ce drop-in épingle Cloudflare + fallback Google
# et impose DoT strict (DNSOverTLS=yes, pas l'upgrade clair "opportunistic").
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com
DNSOverTLS=yes
DNSSEC=yes
FallbackDNS=8.8.8.8#dns.google
